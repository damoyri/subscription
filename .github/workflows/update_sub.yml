name: Auto Update Subscription Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Чекаут репозитория
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Запуск воркера обновления
        run: python update_raw_sub.py

      - name: Загрузка отчёта по мёртвым конфигам
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dead-configs
          path: dead.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Сохранение и пуш изменений в GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add subscription.json
          if git diff --staged --quiet; then
            echo "Новых конфигов нет, файл не изменился."
            exit 0
          fi
          git commit -m "auto: обновление рабочих конфигов в subscription.json"

          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Запушено"
              break
            fi
            echo "Пуш отклонён (гонка с другим запуском), пробуем снова ($i/5)..."
            git fetch origin main
            # Наш subscription.json всегда свежесгенерирован — при конфликте просто берём его версию,
            # построчный мерж автогенерируемого файла не имеет смысла.
            git rebase -X ours origin/main
            if [ "$i" -eq 5 ]; then
              echo "Не удалось запушить после 5 попыток"
              exit 1
            fi
          done

      - name: Push to Bitbucket (SSH)
        env:
          BITBUCKET_SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$BITBUCKET_SSH_PRIVATE_KEY" ]; then
            echo "Bitbucket SSH key not set, skipping"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$BITBUCKET_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts

          if ! git remote get-url bitbucket > /dev/null 2>&1; then
            git remote add bitbucket git@bitbucket.org:damoyri/subscription.git
          fi

          git push --force --all bitbucket
          git push --force --tags bitbucket
