name: Build Config with Balancer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install sing-box
        run: |
          # Скачиваем с правильным заголовком Accept
          curl -L -H "Accept: application/octet-stream" -o sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/latest/download/sing-box-linux-amd64.tar.gz
          # Проверяем, что файл не пустой
          if [ ! -s sing-box.tar.gz ]; then
            echo "Download failed or empty file"
            exit 1
          fi
          # Распаковываем и перемещаем бинарник
          tar -xzf sing-box.tar.gz --strip-components=1 -C /tmp $(tar -tzf sing-box.tar.gz | grep '/sing-box$')
          sudo mv /tmp/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Pull latest changes (avoid conflicts)
        run: git pull --rebase origin main || echo "No upstream changes"

      - name: Run config builder
        env:
          PAID_SUB_URL: ${{ secrets.PAID_SUB_URL }}
        run: python3 build_config.py

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors subscription.json subscription.txt sub2.txt sub2.json
          git commit -m "Update subscription files" || echo "No changes to commit"
          git pull --rebase origin main || echo "Rebase done"
          git push origin main

      - name: Push to Bitbucket (SSH)
        env:
          BITBUCKET_SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$BITBUCKET_SSH_PRIVATE_KEY" ]; then
            echo "Bitbucket SSH key not set, skipping"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$BITBUCKET_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts
          git remote get-url bitbucket || git remote add bitbucket git@bitbucket.org:damoyri/subscription.git
          git push --all bitbucket
          git push --tags bitbucket
