name: Build Config with Balancer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Pull latest changes (avoid conflicts)
        run: git pull --rebase origin main || echo "No upstream changes"

      - name: Run config builder
        run: python3 build_config.py

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.json subscription.txt
          git commit -m "Update subscription files" || echo "No changes to commit"
          git pull --rebase origin main || echo "Rebase done"
          git push origin main

      - name: Push to Bitbucket (SSH)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts
          git remote add bitbucket git@bitbucket.org:damoyri/subscription.git
          git push --force --all bitbucket
          git push --force --tags bitbucket
