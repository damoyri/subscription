name: Build Config with Balancer

on:
  schedule:
    - cron: '0 * * * *'   # каждый час в 0 минут
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Run config builder
        run: python3 build_config.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          git commit -m "Add WL_Balancer config (first) + update paid subscription" || echo "No changes"
          git push origin main
