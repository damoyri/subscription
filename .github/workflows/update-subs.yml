name: Build Config with Balancer

on:
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # <- ЕДИНСТВЕННОЕ ИЗМЕНЕНИЕ

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Install sing-box
        run: |
          RELEASE_JSON=$(curl -s -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest)
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith("-linux-amd64.tar.gz") and (contains("glibc") or contains("musl") | not)) | .browser_download_url' | head -n1)
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Asset not found, trying fallback with version..."
            VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
            if [ -n "$VERSION" ] && [ "$VERSION" != "null" ]; then
              VERSION_NUM=${VERSION#v}
              DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION}/sing-box-${VERSION_NUM}-linux-amd64.tar.gz"
            else
              echo "Failed to determine version"
              exit 1
            fi
          fi
          echo "Downloading from: $DOWNLOAD_URL"
          curl -L -H "Accept: application/octet-stream" -H "User-Agent: curl" -o sing-box.tar.gz "$DOWNLOAD_URL"
          if [ $(stat -c%s "sing-box.tar.gz") -lt 1000000 ]; then
            echo "Downloaded file too small, likely an error page"
            cat sing-box.tar.gz
            exit 1
          fi
          tar -xzf sing-box.tar.gz --strip-components=1 -C /tmp $(tar -tzf sing-box.tar.gz | grep '/sing-box$')
          sudo mv /tmp/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Pull latest changes (avoid conflicts)
        run: git pull --rebase origin main || echo "No upstream changes"

      - name: Run config builder
        env:
          PAID_SUB_URL: ${{ secrets.PAID_SUB_URL }}
        run: python3 build_config.py

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors subscription.json
          git commit -m "Update subscription files" || echo "No changes to commit"
          git pull --rebase origin main || echo "Rebase done"
          git push origin main

      - name: Push to Bitbucket (SSH)
        env:
          BITBUCKET_SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$BITBUCKET_SSH_PRIVATE_KEY" ]; then
            echo "Bitbucket SSH key not set, skipping"
            exit 0
          fi
          
          git fetch --unshallow || true
          
          mkdir -p ~/.ssh
          echo "$BITBUCKET_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts
          
          if ! git remote get-url bitbucket > /dev/null 2>&1; then
            git remote add bitbucket git@bitbucket.org:damoyri/subscription.git
          fi
          
          git push --force --all bitbucket
          git push --force --tags bitbucket
