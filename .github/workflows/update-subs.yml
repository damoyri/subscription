name: Build Config with Balancer

on:
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Run config builder
        env:
          PAID_SUB_URL: ${{ secrets.PAID_SUB_URL }}
        run: python3 build_config.py

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --ignore-errors subscription.json
          git commit -m "Update subscription files" || echo "No changes to commit"
          git pull --rebase origin main || echo "Rebase done"
          git push origin main

      - name: Push to Bitbucket (SSH)
        env:
          BITBUCKET_SSH_PRIVATE_KEY: ${{ secrets.BITBUCKET_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$BITBUCKET_SSH_PRIVATE_KEY" ]; then
            echo "Bitbucket SSH key not set, skipping"
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$BITBUCKET_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H bitbucket.org >> ~/.ssh/known_hosts

          if ! git remote get-url bitbucket > /dev/null 2>&1; then
            git remote add bitbucket git@bitbucket.org:damoyri/subscription.git
          fi

          git push --force --all bitbucket
          git push --force --tags bitbucket
