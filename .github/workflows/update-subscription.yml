name: update-subs

on:
  workflow_dispatch:                      # ручной запуск кнопкой Run workflow
  schedule:
    - cron: "0 1-17/2 * * *"              # = 7:00–23:00 Омск (UTC+6) каждые 2 ч

permissions:
  contents: write                          # чтобы скрипт мог пушить

jobs:
  update-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://sing-box.app/gpg.key | sudo tee /etc/apt/keyrings/sagernet.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/sagernet.asc] https://sing-box.app/deb/ stable main" | sudo tee /etc/apt/sources.list.d/sagernet.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq sing-box

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run subscription updater
        run: python3 update_subscription.py

      - name: Commit and push changes
        run: |
          git add best_ping.txt
          git commit -m "Auto-update (fallback)" || echo "no changes to commit"
          git push origin main || true
