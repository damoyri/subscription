name: update-subs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1-17/2 * * *"   # 7:00–23:00 Омск, каждые 2 ч

permissions:
  contents: write

jobs:
  update-subs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install sing-box (бинарник с официального релиза)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo SagerNet/sing-box \
            --pattern 'sing-box-*-linux-amd64*.tar.gz' --dir /tmp/sb
          for f in /tmp/sb/*.tar.gz; do tar -xzf "$f" -C /tmp/sb; done
          DIR=$(ls -d /tmp/sb/sing-box-*-linux-amd64/ 2>/dev/null | head -1)
          [ -z "$DIR" ] && DIR=$(ls -d /tmp/sb/sing-box-*/ | head -1)
          sudo install -m755 "${DIR}sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run subscription updater
        run: python3 update_subscription.py

      - name: Commit and push changes
        run: |
          git add best_ping.txt
          git commit -m "Auto-update (cloud)" || echo "no changes"
          git push origin main || true
